name: test_bot.yml

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Create .env
        run: |
          cat > .env << EOF
          TOKEN=${{ secrets.DISCORD_TEST_BOT_TOKEN }}
          EOF

      - name: Run Bot
        run: timeout 60s python start.py || test $? -eq 124
